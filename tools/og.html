<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Archivo Narrow';font-weight:500 700;

@font-face{font-family:'Inter';font-weight:400 600;

*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#141A22;color:#fff;
  font-family:'Inter',sans-serif;padding:66px 72px;display:flex;

.wm{font-family:'Archivo Narrow',sans-serif;font-weight:600;font-size:30px;

  color:#D7DCE4;margin-top:6px;font-weight:600}
.wm span{color:#F2A93B}
h1{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:88px;
  line-height:1.02;letter-spacing:-.5px;max-width:19ch}
.rule{width:64px;height:5px;background:#F2A93B;margin-bottom:26px}
.who{display:flex;gap:38px;font-family:'Archivo Narrow',sans-serif;
  font-weight:600;font-size:25px;color:#D7DCE4}
.who b{color:#F2A93B;font-weight:600}
</style></head><body>
<div class="top">
  <img class="mark" src="file:///Users/brucescheer/enterprise-edge-site/public/assets/ee-mark.svg" alt="">
  <div class="wm">The Enterprise <span>Edge</span><em>Clarity creates advantage.</em></div>
</div>
<div>
  <div class="rule"></div>
  <h1>Say yes. Close the deal. Grow the account.</h1>
</div>
<div class="who">
  <div><b>01</b> &nbsp;Bruce Scheer</div>
  <div><b>02</b> &nbsp;Dean Edwards</div>
  <div><b>03</b> &nbsp;Sandy Yu</div>
</div>
</body></html>
