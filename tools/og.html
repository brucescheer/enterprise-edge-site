<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Archivo Narrow';font-weight:500 700;
  src:url('file:///Users/brucescheer/enterprise-edge-site/public/fonts/ArchivoNarrow-latin.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:400 600;
  src:url('file:///Users/brucescheer/enterprise-edge-site/public/fonts/Inter-latin.woff2') format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#141A22;color:#fff;
  font-family:'Inter',sans-serif;padding:66px 72px;display:flex;
  flex-direction:column;justify-content:space-between;overflow:hidden}
.top{display:flex;align-items:center;gap:16px}
/* Composed the same way as the site header so the two cannot drift: the
   kit's symbol, then the wordmark and phrase set in the same fonts. Sizes
   are the header's, scaled up for a 1200px card. */
.sym{height:104px;width:auto;display:block;flex:0 0 auto}
.type{display:flex;flex-direction:column;gap:7px}
.nm{font-family:'Archivo Narrow',sans-serif;font-weight:600;font-size:35px;
  letter-spacing:2.45px;text-transform:uppercase;color:#fff;line-height:1}
.nm i{font-style:normal;color:#F2A93B}
.ph{font-family:'Inter',sans-serif;font-weight:400;font-size:17px;
  letter-spacing:3.74px;text-transform:uppercase;color:#D7DCE4;line-height:1}
.wm span{color:#F2A93B}
h1{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:88px;
  line-height:1.02;letter-spacing:-.5px;max-width:19ch}
.rule{width:64px;height:5px;background:#F2A93B;margin-bottom:26px}
.who{display:flex;gap:38px;font-family:'Archivo Narrow',sans-serif;
  font-weight:600;font-size:25px;color:#D7DCE4}
.who b{color:#F2A93B;font-weight:600}
</style></head><body>
<div class="top">
  <img class="sym" src="file:///Users/brucescheer/enterprise-edge-site/public/assets/ee-symbol.png" alt="">
  <div class="type">
    <div class="nm">The Enterprise <i>Edge</i></div>
    <div class="ph">Clarity creates advantage</div>
  </div>
  
</div>
<div>
  <div class="rule"></div>
  <h1>Say yes. Close the deal. Grow the account.</h1>
</div>
<div class="who">
  <div><b>01</b> &nbsp;Bruce Scheer</div>
  <div><b>02</b> &nbsp;Dean Edwards</div>
  <div><b>03</b> &nbsp;Sandy Yu</div>
</div>
</body></html>
