<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Archivo Narrow';font-weight:500 700;
  src:url('file:///Users/brucescheer/enterprise-edge-site/public/fonts/ArchivoNarrow-latin.woff2') format('woff2')}
@font-face{font-family:'Inter';font-weight:400 600;
  src:url('file:///Users/brucescheer/enterprise-edge-site/public/fonts/Inter-latin.woff2') format('woff2')}
*{margin:0;padding:0;box-sizing:border-box}
/* A feed image, not a poster. One line big enough to read at 350px wide,
   the co-brand lockup Tech Week asks for, and the city and date. Nothing
   else: the description under it carries the rest. */
body{width:1200px;height:1200px;background:#141A22;color:#fff;
  font-family:'Inter',sans-serif;padding:80px;position:relative;overflow:hidden}
.frame{position:absolute;inset:28px;border:2px solid #F2A93B;opacity:.55}
.top{display:flex;align-items:center;gap:34px;height:104px}
.tw{height:96px;width:auto;display:block}
.x{font-size:46px;color:#D7DCE4;opacity:.7;line-height:1}
.lock{display:flex;align-items:center;gap:18px}
.sym{height:104px;width:auto;display:block}
.type{display:flex;flex-direction:column;gap:9px}
.nm{font-family:'Archivo Narrow',sans-serif;font-weight:600;font-size:38px;letter-spacing:2.7px;
  text-transform:uppercase;color:#fff;line-height:1}
.nm i{font-style:normal;color:#F2A93B}
.ph{font-size:17.5px;letter-spacing:3.9px;text-transform:uppercase;color:#D7DCE4;line-height:1}
/* The line. Sized so it is still a headline at feed size. */
h1{position:absolute;left:80px;right:80px;top:50%;transform:translateY(-52%);
  font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:__SIZE__px;line-height:1.02;
  letter-spacing:-1px;color:#fff}
h1 em{font-style:normal;color:#F2A93B}
.foot{position:absolute;left:80px;right:80px;bottom:80px;display:flex;
  justify-content:space-between;align-items:baseline}
.when{font-family:'Archivo Narrow',sans-serif;font-weight:700;font-size:50px;color:#fff;line-height:1}
.when span{color:#F2A93B;margin:0 .35em}
.tag{font-family:'Archivo Narrow',sans-serif;font-weight:600;font-size:30px;letter-spacing:1.5px;
  text-transform:uppercase;color:#D7DCE4}
</style></head><body>
<div class="frame"></div>
<div class="top">
  <img class="tw" src="file:///Users/brucescheer/enterprise-edge-site/tools/source/techweek-__CITY__-white.svg" alt="">
  <div class="x">&times;</div>
  <div class="lock">
    <img class="sym" src="file:///Users/brucescheer/enterprise-edge-site/public/assets/ee-symbol.png" alt="">
    <div class="type"><div class="nm">The Enterprise <i>Edge</i></div><div class="ph">Clarity creates advantage</div></div>
  </div>
</div>
<h1>__HEADLINE__</h1>
<div class="foot">
  <div class="when">__CITYNAME__<span>&middot;</span>__DATE__</div>
  <div class="tag">__TAG__</div>
</div>
</body></html>
