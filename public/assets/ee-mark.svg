<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Enterprise Edge">
  <!--
    Dean's concept, rebuilt as geometry rather than traced from the mockup so
    it stays crisp at 16px and scales to any size.

    Four receding bars are the known structure. The fifth is the way through,
    lit. It replaces an earlier three-bar mark that spelled an E, which read
    as a monogram and said nothing.

    No gradients or glow: at favicon size both turn to mud, and the idea
    survives as flat shapes.
  -->
  <rect width="64" height="64" rx="6" fill="#141A22"/>
  <g fill="#5A6577">
    <rect x="13" y="35" width="5" height="19"/>
    <rect x="20" y="29" width="5" height="25"/>
    <rect x="27" y="23" width="5" height="31"/>
    <rect x="34" y="17" width="5" height="37"/>
  </g>
  <rect x="42" y="10" width="8" height="44" fill="#F2A93B"/>
</svg>
